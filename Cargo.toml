[package]
name = "prc"
version = "0.2.0"
authors = ["Kristóf Ralovich <tade60@freemail.hu>"]
edition = "2024"
license = "MIT"
description = "Rust crate implementation of the PRC (Product Representation Compact) file format, most commonly found embedded in 3D PDFs."
repository = "https://github.com/ralovich/prc-rs"

[lib]
name = "prc"
path = "src/lib.rs"
crate-type = ["lib", "staticlib"]

[dependencies]
inflate = "0.4"
deflate = "1"
libdeflater = "1"
log = "0.4"
byteorder = "1"
modular-bitfield = "0.13.1"
static_assertions = "1.1.0"
num_enum = "0.7.6"
bitstream-io = "4.10.0"
#rayon = "1.11.0"
measure_time = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
#bson = {  version = "3.1.0", features = ["serde"] }

[workspace]
members = ["tools"]
exclude = ["fuzz"]

[profile.release]
lto = "thin"

[profile.reldeb]
inherits = "release"
lto = "off"
debug = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
